name: Stage P3 0.9.2 candidate catalogue (branch only)
on:
  push:
    branches:
      - release/0.9.2-rc1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    if: github.ref == 'refs/heads/release/0.9.2-rc1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Rebuild reproducible Articles module and candidate catalogue
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "0.9.2-rc1"
          test "$(tr -d '\r\n' < var/modules/articles/MODULE-VERSION)" = "1.4.9"
          python3 tools/build_module.py articles
          python3 - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root=Path('.')
          catalogue_path=root/'distribution/catalogue.json'
          data=json.loads(catalogue_path.read_text())
          entries=[p for p in data['packages'] if p['kind']=='module' and p['id']=='articles']
          assert len(entries)==1
          package=entries[0]
          manifest=ET.parse(root/'var/modules/articles/desc.xml').getroot()
          version=manifest.findtext('Version').strip()
          minimum=manifest.findtext('MinimumP3').strip()
          assert version=='1.4.9' and minimum=='0.9.2-rc1'
          name='P3-articles-'+version+'.zip'
          source=root/'dist'/name
          target=root/'distribution'/name
          if package['file']!=name:
              obsolete=root/'distribution'/package['file']
              if obsolete.exists():
                  obsolete.unlink()
          shutil.copyfile(source,target)
          package.update(version=version,file=name,sha256=hashlib.sha256(target.read_bytes()).hexdigest(),
              p3_min=minimum, tested_on={'p3':'0.9.2-rc1','php':'8.5'})
          catalogue_path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          print('CATALOGUE_SHA256='+hashlib.sha256(catalogue_path.read_bytes()).hexdigest())
          print('ARTICLES_SHA256='+package['sha256'])
          PY
          python3 tools/test_distribution.py
          git config user.name "P3 candidate builder"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A distribution
          if ! git diff --cached --quiet; then
            git commit -m "Stage reproducible Articles 1.4.9 and candidate catalogue"
            git push origin HEAD:release/0.9.2-rc1
          fi
          sha256sum distribution/catalogue.json distribution/P3-articles-1.4.9.zip
      - uses: actions/upload-artifact@v4
        with:
          name: P3-0.9.2-rc1-staged-catalogue
          path: |
            distribution/catalogue.json
            distribution/P3-articles-1.4.9.zip
            dist/P3-articles-1.4.9.sha256
          if-no-files-found: error
