name: P3 0.9.2 — archive de validation
on:
  push:
    branches:
      - release/0.9.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, dom, gd, iconv, fileinfo, mbstring, zip
          coverage: none
      - name: Validate candidate and official pinned catalogue
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "0.9.2"
          test "$(tr -d '\r\n' < var/modules/articles/MODULE-VERSION)" = "1.4.9"
          php tools/validate_release.php
          python3 tools/test_catalogue_distribution.py
          python3 tools/test_distribution.py
      - name: Build complete distribution and inspect safety exclusions
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_distribution.py
          zipfile=dist/P3-0.9.2.zip
          test -s "$zipfile"
          unzip -t "$zipfile" >/dev/null
          (cd dist && sha256sum -c P3-0.9.2.sha256)
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          path=Path('dist/P3-0.9.2.zip')
          with ZipFile(path) as z:
              entries=z.namelist()
              must_have={'P3/VERSION','P3/index.php','P3/install.php',
                         'P3/var/modules/articles/article-autosave.js',
                         'P3/var/modules/articles/src/ArticleAutosaveStore.php',
                         'P3/src/Infrastructure/Migrator.php',
                         'P3/RELEASE-NOTES.md'}
              assert must_have.issubset(entries), 'missing release content'
              forbidden=('P3/database/','P3/sessions/','P3/tmp/',
                        'P3/var/sys/','P3/var/private/','P3/var/uploads/',
                        'P3/var/cache/','P3/patches/','P3/distribution/',
                        'P3/.github/')
              for entry in entries:
                  if entry.startswith(forbidden):
                      assert entry.endswith(('/.htaccess','/web.config','/.gitkeep')), entry
                  assert not entry.endswith(('.sqlite','.db','.log')), entry
              assert z.read('P3/VERSION').strip()==b'0.9.2'
              print(f'Candidate verified: {len(entries)} files, {path.stat().st_size} bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: P3-0.9.2-validation
          path: |
            dist/P3-0.9.2.zip
            dist/P3-0.9.2.sha256
            RELEASE-NOTES.md
          if-no-files-found: error
