name: Mobile layout live inspection (one page)

on:
  push:
    branches:
      - audit/mobile-layout-inspect-20261112

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Inspect article markup and CSS
        run: node tools/audit_live_mobile_layout.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-layout-inspection
          path: audit-mobile-layout/*
          if-no-files-found: warn
