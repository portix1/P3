name: Patch P3 - retour aux articles filtres
on:
  push:
    branches:
      - feature/relecture-articles-chatgpt-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tester et construire le correctif
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "0.9.1"
          sudo apt-get update -qq
          sudo apt-get install -y php-xml php-mbstring php-sqlite3 php-gd php-zip >/dev/null
          php -l var/modules/articles/src/ArticleAdminController.php
          php -l var/modules/articles/src/ArticleListPagination.php
          php tools/smoke_test_article_list_context.php
          php tools/smoke_test_template.php
          php tools/smoke_test_article_form_ux.php
          php tools/smoke_test_article_review.php
          mkdir -p patch
          for file in \
            var/modules/articles/src/ArticleAdminController.php \
            var/modules/articles/src/ArticleListPagination.php \
            var/modules/articles/templates/admin-list.tpl \
            var/modules/articles/templates/admin-form.tpl; do
            mkdir -p "patch/$(dirname "$file")"
            cp "$file" "patch/$file"
          done
          cat > patch/LISEZ-MOI-PATCH.txt <<'EOF'
          P3 0.9.1 — Retour à la liste des articles
          Mise à jour de 4 fichiers, aucune réinstallation.
          Prérequis : P3 0.9.1 et les précédents patches du back-office.
          Sauvegarder les fichiers et la base SQLite avant remplacement.
          Déployer uniquement le dossier var/ à la racine du site.
          Ouvrir la liste des articles, choisir un filtre, lancer une recherche
          et aller à la page 2. Modifier un article puis enregistrer :
          les filtres et la page d'origine doivent être conservés.
          Vérifier aussi le bouton Annuler.
          Aucun changement de structure de base.
          EOF
          (cd patch && zip -qr ../P3-patch-retour-liste-0.9.1.zip .)
          unzip -t P3-patch-retour-liste-0.9.1.zip
      - uses: actions/upload-artifact@v4
        with:
          name: P3-patch-retour-liste-0.9.1
          path: P3-patch-retour-liste-0.9.1.zip
          if-no-files-found: error
