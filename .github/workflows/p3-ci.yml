name: P3 validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, dom, gd, iconv, fileinfo, mbstring, zip
          coverage: none

      - name: Environment
        run: |
          php -v
          php -m

      - name: Validate release
        run: php tools/validate_release.php
