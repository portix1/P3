name: P3 validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, dom, gd, iconv, fileinfo, mbstring, zip
          coverage: none

      - name: Environment
        run: |
          php -v
          php -m

      - name: Validate release
        env:
          P3_DEVELOPMENT_VALIDATION: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: php tools/validate_release.php

      - name: Validate public search index reuse
        run: php var/modules/search/tests/smoke_test_text_fragments.php

      - name: Verify reproducible official Articles package
        env:
          P3_DEVELOPMENT_VALIDATION: ${{ github.event_name == 'pull_request' && '1' || '0' }}
        run: python3 tools/test_catalogue_distribution.py

  home-browser:
    name: Accueil — navigateur et HTTP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, dom, gd, iconv, fileinfo, mbstring, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate home page in an isolated installation
        env:
          HOME_SCREENSHOT_DIR: home-browser-previews
        run: php tools/smoke_test_home_http.php --browser
      - name: Validate mobile article reading at 320 to 1280 px
        run: node tools/test_mobile_article_reading.mjs
      - name: Validate compact mobile header and search
        run: node tools/test_mobile_header.mjs
      - name: Keep browser previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-browser-previews
          path: home-browser-previews/*.png
          if-no-files-found: ignore

  publish:
    name: Distribution GitHub
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release P3 ')
    needs: [validate, home-browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4

      - name: Build distribution
        run: |
          python3 tools/test_distribution.py
          python3 tools/build_distribution.py

      - name: Publish distribution
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(cat VERSION)"
          flags=()
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "v$version" \
            "dist/P3-$version.zip" "dist/P3-$version.sha256" \
            --target "$GITHUB_SHA" --title "P3 $version" \
            --notes-file RELEASE-NOTES.md "${flags[@]}"

