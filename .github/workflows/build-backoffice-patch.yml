name: Patch P3 - relecture des articles
on:
  push:
    branches:
      - feature/relecture-articles-chatgpt-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Construire le patch pour P3 0.9.1
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "0.9.1"
          git fetch origin main
          mkdir -p patch
          while IFS= read -r file; do
            case "$file" in
              src/*|var/*)
                test -f "$file" || continue
                mkdir -p "patch/$(dirname "$file")"
                cp "$file" "patch/$file"
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMRT 33efc9fd0f89142a9f44d63c41292e6e5d9861f6...HEAD)
          test -f patch/var/admin/templates/users-form.tpl
          cat > patch/LISEZ-MOI-PATCH.txt <<'EOF'
          PATCH P3 — Ergonomie rédaction et droits
          Version de départ obligatoire : P3 0.9.1 et correctif de relecture déjà appliqué.
          Ce ZIP n'est pas un installateur.
          Ne pas appliquer sur P3 0.8.4 ou sur une autre version.
          1. Sauvegarder les fichiers du site et sa base SQLite.
          2. Vérifier que VERSION contient 0.9.1.
          3. Envoyer uniquement les dossiers src/ et var/ de cette archive à la racine du site,
             en conservant l'arborescence et en remplaçant les fichiers existants.
          4. Vérifier la fiche utilisateur et l'enregistrement des brouillons.
          Ce correctif n'effectue aucune migration de base de données.
          Attention : aucun fichier de base de données, d'upload ou de configuration
          privée n'est inclus.
          Ceci est une version de test, non validée pour la production.
          EOF
          (cd patch && zip -qr ../P3-patch-ux-redaction-0.9.1-test.zip .)
          unzip -t P3-patch-ux-redaction-0.9.1-test.zip
      - name: Publier le patch ZIP
        uses: actions/upload-artifact@v4
        with:
          name: P3-patch-ux-redaction-0.9.1-test
          path: P3-patch-ux-redaction-0.9.1-test.zip
          if-no-files-found: error
