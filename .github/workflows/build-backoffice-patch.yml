name: Patch P3 - relecture des articles
on:
  push:
    branches:
      - feature/relecture-articles-chatgpt-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Construire le patch pour P3 0.9.1
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "0.9.1"
          git fetch origin main
          mkdir -p patch
          while IFS= read -r file; do
            case "$file" in
              src/*|var/*)
                test -f "$file" || continue
                mkdir -p "patch/$(dirname "$file")"
                cp "$file" "patch/$file"
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMRT origin/main...HEAD)
          test -f patch/var/modules/articles/src/ArticleReviewPolicy.php
          cat > patch/LISEZ-MOI-PATCH.txt <<'EOF'
          PATCH P3 — Relecture des articles
          Version de départ obligatoire : P3 0.9.1.
          Ce ZIP n'est pas un installateur.
          Ne pas appliquer sur P3 0.8.4 ou sur une autre version.
          1. Sauvegarder les fichiers du site et sa base SQLite.
          2. Vérifier que VERSION contient 0.9.1.
          3. Envoyer uniquement les dossiers src/ et var/ de cette archive à la racine du site,
             en conservant l'arborescence et en remplaçant les fichiers existants.
          4. La migration SQLite vers le schéma 9 se fait automatiquement au lancement
             du moteur, sous réserve de son fonctionnement normal.
          5. Vérifier les profils rédacteurs, les brouillons et la relecture.
          Attention : aucun fichier de base de données, d'upload ou de configuration
          privée n'est inclus.
          Ceci est une version de test, non validée pour la production.
          EOF
          (cd patch && zip -qr ../P3-patch-relecture-0.9.1-test.zip .)
          unzip -t P3-patch-relecture-0.9.1-test.zip
      - name: Publier le patch ZIP
        uses: actions/upload-artifact@v4
        with:
          name: P3-patch-relecture-0.9.1-test
          path: P3-patch-relecture-0.9.1-test.zip
          if-no-files-found: error
