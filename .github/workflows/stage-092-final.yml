name: Préparer le catalogue P3 0.9.2 (branche isolée)
on:
  push:
    branches:
      - release/0.9.2
permissions:
  contents: write
jobs:
  stage:
    if: github.ref == 'refs/heads/release/0.9.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Construire Articles 1.4.9 et le catalogue stable de validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "0.9.2"
          test "$(tr -d '\r\n' < var/modules/articles/MODULE-VERSION)" = "1.4.9"
          python3 tools/build_module.py articles
          python3 - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root=Path('.')
          manifest=ET.parse(root/'var/modules/articles/desc.xml').getroot()
          assert manifest.findtext('Version').strip()=='1.4.9'
          assert manifest.findtext('MinimumP3').strip()=='0.9.2'
          path=root/'distribution/catalogue.json'
          data=json.loads(path.read_text())
          entries=[x for x in data['packages'] if x['kind']=='module' and x['id']=='articles']
          assert len(entries)==1
          zip_name='P3-articles-1.4.9.zip'
          shutil.copyfile(root/'dist'/zip_name,root/'distribution'/zip_name)
          entries[0].update(version='1.4.9',file=zip_name,
            sha256=hashlib.sha256((root/'distribution'/zip_name).read_bytes()).hexdigest(),
            p3_min='0.9.2',tested_on={'p3':'0.9.2','php':'8.5'})
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          print('CATALOGUE_SHA256='+hashlib.sha256(path.read_bytes()).hexdigest())
          print('ARTICLES_SHA256='+entries[0]['sha256'])
          PY
          python3 tools/test_distribution.py
          git config user.name "P3 version builder"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add distribution/catalogue.json distribution/P3-articles-1.4.9.zip
          if ! git diff --cached --quiet; then
            git commit -m "Prepare P3 0.9.2 pinned module catalogue"
            git push origin HEAD:release/0.9.2
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: P3-0.9.2-catalogue-staged
          path: |
            distribution/catalogue.json
            distribution/P3-articles-1.4.9.zip
          if-no-files-found: error
