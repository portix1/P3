name: Patch P3 - demandes de relecture
on:
  push:
    branches:
      - feature/relecture-articles-chatgpt-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controle et fabrication du correctif
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "0.9.1"
          php -l var/modules/articles/src/ArticleAdminController.php
          php -l var/modules/articles/lang/fr.php
          php -l var/modules/articles/lang/en.php
          php tools/smoke_test_template.php
          if grep -En '\{% if [^%]*(\&\&|\|\|)[^%]*%\}' var/modules/articles/templates/admin-list.tpl; then
            echo 'Condition de template non supportee'
            exit 1
          fi
          mkdir -p patch
          for file in var/modules/articles/src/ArticleAdminController.php var/modules/articles/templates/admin-list.tpl var/modules/articles/lang/fr.php var/modules/articles/lang/en.php var/admin/style.css; do
            mkdir -p "patch/$(dirname "$file")"
            cp "$file" "patch/$file"
          done
          cat > patch/LISEZ-MOI-PATCH.txt <<'EOF'
          P3 0.9.1 — Correction : demandes de relecture
          Patch de fichiers uniquement. Aucune reinstallation, aucune migration.
          Prerequis : les quatre correctifs precedents, y compris le correctif
          urgent de la liste des articles, doivent etre appliques.
          Sauvegarder les fichiers avant de copier le dossier var/ a la racine de P3.
          Tests : dans Redaction > Articles, un administrateur voit le lien
          "Voir les demandes" s'il existe des articles en attente, peut valider
          ou renvoyer pour correction. Le redacteur ne voit pas ce raccourci.
          EOF
          (cd patch && zip -qr ../P3-patch-demandes-relecture-0.9.1.zip .)
          unzip -t P3-patch-demandes-relecture-0.9.1.zip
      - uses: actions/upload-artifact@v4
        with:
          name: P3-patch-demandes-relecture-0.9.1
          path: P3-patch-demandes-relecture-0.9.1.zip
          if-no-files-found: error
