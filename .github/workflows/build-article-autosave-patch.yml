name: Patch P3 - sauvegarde automatique des articles
on:
  push:
    branches:
      - feature/relecture-articles-chatgpt-20261113
  workflow_dispatch:
permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifier la sauvegarde automatique et construire le ZIP
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < VERSION)" = "0.9.1"
          sudo apt-get update -qq
          sudo apt-get install -y php-xml php-mbstring php-sqlite3 php-gd php-zip >/dev/null
          php -l var/modules/articles/src/ArticleAutosaveStore.php
          php -l var/modules/articles/src/ArticleRepository.php
          php -l var/modules/articles/src/ArticleAdminController.php
          node --check var/modules/articles/article-autosave.js
          php tools/smoke_test_article_autosave.php
          php tools/smoke_test_article_form_ux.php
          php tools/smoke_test_template.php
          php tools/smoke_test_editor_workflow.php
          mkdir -p patch
          for file in \
            var/modules/articles/src/ArticleAutosaveStore.php \
            var/modules/articles/src/ArticleRepository.php \
            var/modules/articles/src/ArticleAdminController.php \
            var/modules/articles/article-autosave.js \
            var/modules/articles/templates/admin-form.tpl \
            var/admin/index.tpl; do
            mkdir -p "patch/$(dirname "$file")"
            cp "$file" "patch/$file"
          done
          cat > patch/LISEZ-MOI-PATCH.txt <<'EOF'
          P3 0.9.1 — Sauvegarde automatique des articles
          PATCH DE MISE A JOUR : aucun installateur ni reinstallation.
          Prerequis : P3 0.9.1 avec tous les correctifs precedents du back-office.
          Sauvegarder les fichiers ET la base SQLite avant application.
          Copier le dossier var/ a la racine de P3 en remplaçant les fichiers.
          Le logiciel cree automatiquement une table privee article_autosaves
          dans la base SQLite au premier usage ; les articles publics restent inchanges.
          Pendant la redaction, les changements sont sauvegardes automatiquement
          toutes les 30 secondes, dans un brouillon de recuperation distinct.
          En cas de reouverture, P3 propose de restaurer les modifications.
          Un enregistrement manuel confirme les modifications et efface
          le brouillon de recuperation du compte.
          A tester : nouvel article, article existant, reouverture, validation
          manuelle et conservation du statut publie.
          EOF
          (cd patch && zip -qr ../P3-patch-sauvegarde-automatique-0.9.1.zip .)
          unzip -t P3-patch-sauvegarde-automatique-0.9.1.zip
      - uses: actions/upload-artifact@v4
        with:
          name: P3-patch-sauvegarde-automatique-0.9.1
          path: P3-patch-sauvegarde-automatique-0.9.1.zip
          if-no-files-found: error
